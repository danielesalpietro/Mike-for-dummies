volumes:
  minio-data:
  frontend-node-modules:
  backend-node-modules:
  qdrant-data:

services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  supabase-db:
    build:
      context: .
      dockerfile: supabase/postgres/Dockerfile
    container_name: mike_supabase_db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./supabase/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── GoTrue (Supabase Auth) ───────────────────────────────────────────────
  supabase-auth:
    build:
      context: .
      dockerfile: supabase/gotrue/Dockerfile
    container_name: mike_supabase_auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:${SUPABASE_PORT:-8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    depends_on:
      supabase-db:
        condition: service_healthy

  # ─── PostgREST ────────────────────────────────────────────────────────────
  supabase-rest:
    build:
      context: .
      dockerfile: postgrest/Dockerfile
    container_name: mike_supabase_rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    depends_on:
      supabase-db:
        condition: service_healthy

  # ─── nginx API gateway (routes /auth/v1 → GoTrue, /rest/v1 → PostgREST) ──
  # No healthcheck here — GoTrue takes variable time to run its own migrations.
  # mike-backend uses restart: unless-stopped to recover if it starts too early.
  supabase-api:
    image: nginx:alpine
    container_name: mike_supabase_api
    restart: unless-stopped
    ports:
      - "${SUPABASE_PORT:-8000}:8000"
    volumes:
      - ./supabase/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - supabase-auth
      - supabase-rest

  # ─── DB migration ─────────────────────────────────────────────────────────
  db-migrate:
    image: postgres:15-alpine
    container_name: mike_db_migrate
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - sh
      - -c
      - "echo 'Waiting for GoTrue to finish auth migrations...' && sleep 20 && psql -h supabase-db -U postgres -d postgres -f /migrations/000_one_shot_schema.sql && echo 'App schema applied.'"
    depends_on:
      supabase-auth:
        condition: service_started
      supabase-db:
        condition: service_healthy

  # ─── MinIO (S3-compatible storage) ───────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: mike_minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO bucket setup ───────────────────────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: mike_minio_setup
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${R2_BUCKET_NAME:-mike}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/$${MINIO_BUCKET};
        echo 'Bucket ready: '$${MINIO_BUCKET};
      "

  # ─── Qdrant (vector store for Mem0) ──────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mike_qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Mem0 memory microservice ─────────────────────────────────────────────
  mem0-service:
    build:
      context: ./mem0-service
      dockerfile: Dockerfile
    container_name: mike_mem0
    restart: unless-stopped
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MEM0_LLM_MODEL: ${MEM0_LLM_MODEL:-claude-haiku-4-5-20251001}
      MEM0_EMBEDDER_MODEL: ${MEM0_EMBEDDER_MODEL:-}
    depends_on:
      qdrant:
        condition: service_healthy

  # ─── Backend ──────────────────────────────────────────────────────────────
  mike-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mike_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      SUPABASE_URL: http://supabase-api:8000
      SUPABASE_SECRET_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      R2_ENDPOINT_URL: http://minio:9000
      R2_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      R2_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-mike}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:-}
      MEM0_SERVICE_URL: http://mem0-service:8100
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: ${PORT:-3001}
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    depends_on:
      supabase-api:
        condition: service_started
      minio:
        condition: service_healthy
      mem0-service:
        condition: service_started
        required: false

  # ─── Frontend ─────────────────────────────────────────────────────────────
  mike-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mike_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:${SUPABASE_PORT:-8000}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${PORT:-3001}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - mike-backend
