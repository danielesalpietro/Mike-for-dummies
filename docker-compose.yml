services:
  mike-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mike_backend
    ports:
      - "3001:3001"
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules

  mike-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mike_frontend
    ports:
      - "3000:3000"
    env_file: ./frontend/.env.local
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - mike-backend