#cloud-config
packages:
  - python3
  - make
  - g++
  - curl
  - ca-certificates

runcmd:
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs

write_files:
  - path: /etc/systemd/system/mike-frontend.service
    content: |
      [Unit]
      Description=Mike Frontend (Next.js dev server)
      After=network.target

      [Service]
      Type=simple
      WorkingDirectory=/app
      ExecStart=/usr/bin/npm run dev
      Restart=on-failure
      RestartSec=5
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
