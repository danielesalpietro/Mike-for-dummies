# Mike Enterprise AI Platform — Nginx Reverse Proxy
# Routes all services through a single entry point on port 80.
# For HTTPS, uncomment the TLS server block and add your certificates
# under nginx/ssl/ (cert.pem + key.pem).

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ── Upstream targets ─────────────────────────────────────────────────────

    upstream mike_frontend   { server mike-frontend:3000; }
    upstream mike_backend    { server mike-backend:3001; }
    upstream open_webui      { server open-webui:8080; }
    upstream mlflow          { server mlflow:5000; }
    upstream airflow         { server airflow-webserver:8080; }
    upstream superset        { server superset:8088; }
    upstream keycloak        { server keycloak:8080; }
    upstream qdrant          { server qdrant:6333; }
    upstream minio_console   { server minio:9001; }

    # ── HTTP server ──────────────────────────────────────────────────────────

    server {
        listen 80;
        server_name _;

        # Mike frontend (default)
        location / {
            proxy_pass http://mike_frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Mike backend API
        location /api/ {
            proxy_pass http://mike_backend/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            client_max_body_size 100m;
        }

        # Open WebUI (Ollama chat interface)
        location /chat/ {
            proxy_pass http://open_webui/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # MLflow experiment tracking
        location /mlflow/ {
            proxy_pass http://mlflow/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Apache Airflow
        location /airflow/ {
            proxy_pass http://airflow/airflow/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Apache Superset BI
        location /superset/ {
            proxy_pass http://superset/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Keycloak SSO
        location /auth/ {
            proxy_pass http://keycloak/auth/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Qdrant (internal — restrict in production!)
        location /qdrant/ {
            proxy_pass http://qdrant/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
        }

        # MinIO console
        location /minio/ {
            proxy_pass http://minio_console/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ── HTTPS server (uncomment after placing certs in nginx/ssl/) ───────────
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name your.domain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # ... same location blocks as above ...
    # }
}
