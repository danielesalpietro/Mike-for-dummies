events {
  worker_connections 1024;
}

http {
  # Use Docker's internal DNS so upstream names are resolved at request time,
  # not at startup — prevents nginx from crashing when containers are not yet ready.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8000;

    # GoTrue — auth endpoints
    location /auth/v1/ {
      set $auth http://supabase-auth:9999;
      proxy_pass         $auth/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # PostgREST — database REST endpoints
    location /rest/v1/ {
      set $rest http://supabase-rest:3000;
      proxy_pass         $rest/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
