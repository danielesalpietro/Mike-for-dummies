events {
  worker_connections 1024;
}

http {
  # Use Docker's internal DNS so upstream names are resolved at request time,
  # not at startup — prevents nginx from crashing when containers are not yet ready.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Map the request Origin to an allowed value; empty string = not allowed.
  map $http_origin $cors_origin {
    default                    "";
    "http://localhost:3000"    "http://localhost:3000";
    "http://127.0.0.1:3000"   "http://127.0.0.1:3000";
  }

  server {
    listen 8000;

    # ── GoTrue auth endpoints ──────────────────────────────────────────────
    location /auth/v1/ {
      # CORS preflight — handle locally so the browser proceeds with the real request
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'authorization, content-type, apikey, x-client-info, x-supabase-api-version' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age'           86400 always;
        return 204;
      }

      # Forward CORS headers on actual responses too
      add_header 'Access-Control-Allow-Origin'      $cors_origin always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;

      # Strip /auth/v1 prefix so GoTrue receives e.g. /signup, /token, /health
      rewrite ^/auth/v1/(.*)$ /$1 break;

      set $auth http://supabase-auth:9999;
      proxy_pass         $auth;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── PostgREST REST endpoints ───────────────────────────────────────────
    location /rest/v1/ {
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'authorization, content-type, apikey, x-client-info, prefer, range' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age'           86400 always;
        return 204;
      }

      add_header 'Access-Control-Allow-Origin'      $cors_origin always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;

      rewrite ^/rest/v1/(.*)$ /$1 break;

      set $rest http://supabase-rest:3000;
      proxy_pass         $rest;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
