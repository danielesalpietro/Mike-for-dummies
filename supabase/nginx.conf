events {
  worker_connections 1024;
}

http {
  # Use Docker's internal DNS so upstream names are resolved at request time,
  # not at startup — prevents nginx from crashing when containers are not yet ready.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8000;

    # ── GoTrue auth endpoints ──────────────────────────────────────────────
    location /auth/v1/ {
      # set must come before rewrite...break, otherwise the variable is empty
      set $auth http://supabase-auth:9999;

      # Handle CORS preflight locally so the browser sees apikey in allowed headers
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin'      'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'authorization, content-type, apikey, x-client-info, x-supabase-api-version' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age'           86400 always;
        return 204;
      }

      # Strip /auth/v1 prefix — GoTrue expects /signup, /token, /health, etc.
      rewrite ^/auth/v1/(.*)$ /$1 break;

      proxy_pass         $auth;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── PostgREST REST endpoints ───────────────────────────────────────────
    location /rest/v1/ {
      set $rest http://supabase-rest:3000;

      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin'      'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'authorization, content-type, apikey, x-client-info, prefer, range' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age'           86400 always;
        return 204;
      }

      rewrite ^/rest/v1/(.*)$ /$1 break;

      proxy_pass         $rest;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
